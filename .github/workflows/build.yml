name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libasound2-dev
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: pc_midi_keyboard-linux
          path: build/pc_midi_keyboard

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-SDL2
      - run: mingw32-make
      - uses: actions/upload-artifact@v4
        with:
          name: pc_midi_keyboard-windows
          path: build/pc_midi_keyboard.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2 pkg-config
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: pc_midi_keyboard-macos
          path: build/pc_midi_keyboard
