name: build

# Every push / PR: build, smoke-test and package all three platforms; the
# packages are kept as run artifacts.
# Pushing a tag v* (e.g. v1.0.0) also publishes them as a GitHub Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    # Pinned rather than -latest: the build stays reproducible, and an older
    # glibc lets the binary run on more distributions.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libasound2-dev xvfb
      - run: make
      # Starts the app on a virtual display, draws one frame and exits.
      - name: Smoke test
        timeout-minutes: 2
        run: xvfb-run -a build/pc_midi_keyboard --screenshot build/shot-linux.bmp --demo
      # tar keeps the executable bit, which a plain artifact zip would lose.
      - name: Package
        run: |
          mkdir -p dist pkg/pc_midi_keyboard
          cp build/pc_midi_keyboard README.md pkg/pc_midi_keyboard/
          tar -czf dist/pc_midi_keyboard-linux-x64.tar.gz -C pkg pc_midi_keyboard
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-linux
          path: build/shot-linux.bmp

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          # UCRT64 is MSYS2's recommended environment (MINGW64 is deprecated).
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-SDL2
      - run: mingw32-make
      - name: Smoke test
        timeout-minutes: 2
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -Wait build/pc_midi_keyboard.exe -ArgumentList '--screenshot build/shot-windows.bmp --demo'
          if ($p.ExitCode -ne 0 -or -not (Test-Path build/shot-windows.bmp)) { throw "app did not start (exit $($p.ExitCode))" }
      # The .exe is fully static: nothing else is needed to run it.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/pc_midi_keyboard.exe, README.md -DestinationPath dist/pc_midi_keyboard-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-windows
          path: build/shot-windows.bmp

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SDL_VERSION: 2.32.10
    steps:
      - uses: actions/checkout@v4
      # SDL2 is built from the official source as a static, universal
      # library. Homebrew's sdl2 is now sdl2-compat, which loads SDL3 at run
      # time and cannot be bundled reliably; static linking needs no bundled
      # dylibs at all and gives one binary for Apple Silicon and Intel.
      - name: Build static SDL2
        run: |
          curl -fsSL -o sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz"
          tar -xzf sdl.tar.gz
          cmake -S "SDL2-${SDL_VERSION}" -B sdl-build -DCMAKE_BUILD_TYPE=Release \
                -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build sdl-build --parallel
          cmake --install sdl-build --prefix "$PWD/sdl"
      - name: Build
        run: |
          SDL_CFLAGS="$(sdl/bin/sdl2-config --cflags)"
          SDL_LIBS="$(sdl/bin/sdl2-config --static-libs)"
          echo "SDL_CFLAGS=$SDL_CFLAGS"
          echo "SDL_LIBS=$SDL_LIBS"
          if [ -z "$SDL_CFLAGS" ] || [ -z "$SDL_LIBS" ]; then
            echo "sdl2-config returned no flags"; exit 1
          fi
          make CC="clang -arch arm64 -arch x86_64 -mmacosx-version-min=11.0" \
               SDL_CFLAGS="$SDL_CFLAGS" SDL_LIBS="$SDL_LIBS"
          lipo -info build/pc_midi_keyboard
      - name: Make app bundle
        run: |
          APP="pkg/PC MIDI Keyboard.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/pc_midi_keyboard "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>               <string>PC MIDI Keyboard</string>
            <key>CFBundleDisplayName</key>        <string>PC MIDI Keyboard</string>
            <key>CFBundleExecutable</key>         <string>pc_midi_keyboard</string>
            <key>CFBundleIdentifier</key>         <string>local.pc-midi-keyboard</string>
            <key>CFBundlePackageType</key>        <string>APPL</string>
            <key>CFBundleShortVersionString</key> <string>${{ github.ref_name }}</string>
            <key>CFBundleIconFile</key>           <string>AppIcon</string>
            <key>LSMinimumSystemVersion</key>     <string>11.0</string>
            <key>NSHighResolutionCapable</key>    <false/>
          </dict>
          </plist>
          EOF
          # Finder icon from icon.ico; the app still works if this fails.
          ( sips -s format png icon.ico --out icon.png &&
            mkdir icon.iconset &&
            for s in 16 32 128 256; do
              sips -z $s $s icon.png --out icon.iconset/icon_${s}x${s}.png
            done &&
            iconutil -c icns icon.iconset -o "$APP/Contents/Resources/AppIcon.icns" ) || echo "icon skipped"
          # Ad-hoc signature for the whole bundle (no Apple developer ID).
          codesign --force --deep -s - "$APP"
      - name: Check binary needs only system libraries
        run: |
          otool -L "pkg/PC MIDI Keyboard.app/Contents/MacOS/pc_midi_keyboard"
          if otool -L "pkg/PC MIDI Keyboard.app/Contents/MacOS/pc_midi_keyboard" | grep -E '^[[:space:]]' | grep -vE '^[[:space:]]*(/System/Library/|/usr/lib/)'; then
            echo "binary depends on a non-system library"; exit 1
          fi
      - name: Smoke test
        timeout-minutes: 2
        run: '"pkg/PC MIDI Keyboard.app/Contents/MacOS/pc_midi_keyboard" --screenshot build/shot-macos.bmp --demo'
      - name: Package
        run: |
          mkdir -p dist
          # ditto keeps the bundle's symlinks, permissions and signature.
          ditto -c -k --keepParent "pkg/PC MIDI Keyboard.app" dist/pc_midi_keyboard-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-macos
          path: build/shot-macos.bmp
  release:
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
